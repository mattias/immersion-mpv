# immersion-mpv settings. The easiest way to change them is the plugin's
# Settings window (Alt+i in mpv), which writes this file. Lines starting with
# # are defaults; remove the # and change the value to override one.
# The AniList token and Jimaku key are not kept here: enter them in the
# Settings window, which keeps them in the data folder.

# Count listening time, subtitle lines and characters per file and day.
#stats_enabled=yes
# Count only lines with Japanese in them. Listening time always counts.
#stats_japanese_only=yes

# Fetch the episode's subtitle from Jimaku when the file has no Japanese one.
#jimaku_enabled=yes
# Time the Jimaku subtitle to the video, by when lines start: against another
# subtitle track of the file in any language, or else against the speech that
# Whisper hears (sync_whisper; install it with install-whisper.ps1). Done once
# per video; a timed copy is kept. Too little agreement leaves it as it is.
#sync_enabled=yes
#sync_whisper=yes
# Empty: install-whisper.ps1's Python, and Anki Miner's large-v3 when it is
# there, else large-v3-turbo (downloaded on first use).
#whisper_python=
#whisper_model=
# Empty: the ffmpeg next to mpv, then ffmpeg on PATH.
#ffmpeg_path=

# Mark an episode on AniList when enough of it has really played.
#anilist_enabled=yes
# Percent of the episode that must have played.
#anilist_threshold=85
# Test mode: say what would be sent and send nothing. Turn it off to let the
# plugin change your AniList list.
#anilist_dry_run=yes

# Your AniList API client's ID. The Settings window uses it to open the page
# that shows you a token; it is not secret.
#anilist_client_id=

# The services' addresses.
#anilist_url=https://graphql.anilist.co
#jimaku_url=https://jimaku.cc

# Empty: the Electron next to this plugin, or hachidori-mpv's.
#electron_path=
